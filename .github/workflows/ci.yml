name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opslens_runtime_test
          POSTGRES_USER: opslens_test
          POSTGRES_PASSWORD: EXAMPLE_DISPOSABLE_CI_PASSWORD
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opslens_test -d opslens_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPSLENS_RUNTIME_DATABASE_URL: postgresql+psycopg://opslens_test:EXAMPLE_DISPOSABLE_CI_PASSWORD@127.0.0.1:5432/opslens_runtime_test
      OPSLENS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and validation tools
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Lint and type checks
        run: |
          python -m ruff check .
          python -m pyright
          python -m pip check
      - name: Database migrations and tests
        run: |
          python -m alembic upgrade head
          python -m pytest -q
      - name: Runtime imports and isolated wheel
        run: |
          python scripts/smoke_test.py
          python scripts/packaging_smoke.py
      - name: Synthetic data and readiness
        run: |
          python scripts/generate_demo_data.py
          python scripts/readiness_check.py
      - name: Real UI HTTP smoke
        run: python scripts/ui_smoke_test.py
      - name: Compose configuration
        env:
          POSTGRES_PASSWORD: EXAMPLE_DISPOSABLE_COMPOSE_PASSWORD
        run: docker compose config --quiet
